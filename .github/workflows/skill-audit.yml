name: Skill audit

on:
  push:
    branches: [main]
    paths:
      - "skills/personal/**"
      - ".github/workflows/skill-audit.yml"
  pull_request:
    paths:
      - "skills/personal/**"
      - ".github/workflows/skill-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run audit behavioral regressions
        run: uv run --script skills/personal/th-tooling/subskills/audit-skill-hygiene/tests/test_skill_usage_audit.py
      - name: Self-test the audit script
        run: uv run skills/personal/th-engineering/subskills/skill-standards/tests/run_tests.py
      - name: Run report-only Beads safety suites
        run: |
          uv run skills/personal/beads-orchestration/subskills/beads-coordinator/tests/test_normalize_pr_review_state.py
          uv run skills/personal/beads-orchestration/subskills/beads-coordinator/tests/test_rank_ready_work.py
          uv run skills/personal/beads-orchestration/subskills/beads-coordinator/tests/test_workflow_contract.py
          uv run skills/personal/beads-orchestration/subskills/beads-cleanup/tests/test_cleanup_scan.py
          uv run skills/personal/beads-orchestration/subskills/beads-pr-reviewer-worker/tests/test_skill_package.py
          uv run skills/personal/beads-orchestration/subskills/beads-pr-reviewer-worker/tests/test_scripts.py
      - name: Audit personal skill packages
        # --strict: skills/personal is warning-free as of dotfiles-hyd; keep it that way.
        run: >
          uv run skills/personal/th-engineering/subskills/skill-standards/scripts/audit_skill.py
          --all skills/personal --strict
